name: Weekly Executive Intelligence

on:

  schedule:
    - cron: '0 6 * * 1'

  workflow_dispatch:

permissions:
  contents: write

jobs:

  intelligence:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5

      with:
        python-version: '3.12'

        cache: 'pip'

    - name: Install Dependencies

      run: |

        python -m pip install --upgrade pip

        pip install \
            feedparser \
            beautifulsoup4 \
            lxml

    - name: Generate Executive Report

      run: |

        python fetch_news.py

    - name: Save Report

      run: |

        mkdir -p reports

        TODAY=$(date +%F)

        cp weekly_report.md reports/${TODAY}.md

    - name: Generate Website

      run: |

        python generate_index.py

    - name: Commit Changes

      run: |

        git config --global user.name github-actions

        git config --global user.email github-actions@github.com

        git add .

        git diff --cached --quiet && exit 0

        git commit -m "Weekly Executive Report $(date +%F)"

        git push
