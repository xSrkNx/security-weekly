name: Weekly Executive Intelligence

on:
  schedule:
    - cron: "0 6 * * 1"      # Every Monday 06:00 UTC

  workflow_dispatch:

permissions:
  contents: write

jobs:
  intelligence:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Executive Intelligence Report
        run: |
          python scripts/fetch_news.py

      - name: Archive Weekly Report
        shell: bash
        run: |
          mkdir -p reports
          TODAY=$(date +%F)
          cp weekly_report.md reports/${TODAY}.md

      - name: Generate Portal
        run: |
          python scripts/generate_index.py

      - name: Commit Updated Reports
        shell: bash
        run: |

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/
          git add index.html

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Weekly Executive Intelligence $(date +%F)"
          git push
